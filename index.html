<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCLEX NGN Practice Module</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Header & Navigation -->
    <header class="bg-slate-900 text-white p-4 shadow-md flex flex-col shrink-0 z-10">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-400"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                NCLEX NGN Practice
            </h1>
            <div class="flex items-center gap-3">
                <button onclick="openAiModal()" class="bg-indigo-500 hover:bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    AI Generator
                </button>
                <div class="text-sm bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 hidden sm:block">Case #1204</div>
            </div>
        </div>
        
        <!-- Step Navigation -->
        <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide" id="step-nav">
            <!-- Navigation buttons injected by JS -->
        </div>
    </header>

    <!-- Main Content: Split Screen (Stacks on Mobile) -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-4 p-4 overflow-y-auto lg:overflow-hidden ngn-split-screen">
        
        <!-- Left Panel: Chart / Tabs -->
        <section class="flex flex-col bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden min-h-[400px] lg:h-full">
            
            <!-- Tab Navigation -->
            <nav class="flex border-b border-slate-200 bg-slate-50 shrink-0">
                <button onclick="openTab('notes')" id="btn-notes" class="tab-btn flex-1 py-3 px-4 text-sm font-semibold text-blue-700 bg-white border-b-2 border-blue-600 focus:outline-none transition-colors">
                    Nurses' Notes
                </button>
                <button onclick="openTab('vitals')" id="btn-vitals" class="tab-btn flex-1 py-3 px-4 text-sm font-medium text-slate-500 hover:text-slate-700 hover:bg-slate-100 focus:outline-none transition-colors">
                    Vital Signs
                </button>
                <button onclick="openTab('labs')" id="btn-labs" class="tab-btn flex-1 py-3 px-4 text-sm font-medium text-slate-500 hover:text-slate-700 hover:bg-slate-100 focus:outline-none transition-colors">
                    Labs
                </button>
            </nav>

            <!-- Tab Content Area -->
            <div class="flex-1 p-6 overflow-y-auto bg-white">
                <div id="tab-notes" class="tab-content block space-y-4"></div>
                <div id="tab-vitals" class="tab-content hidden space-y-4"></div>
                <div id="tab-labs" class="tab-content hidden space-y-4"></div>
            </div>
        </section>

        <!-- Right Panel: Question -->
        <section class="flex flex-col bg-white rounded-xl border border-slate-200 shadow-sm min-h-[400px] lg:h-full overflow-hidden">
            <!-- Content will be injected here via JS -->
            <div id="question-text" class="flex-1 overflow-y-auto flex flex-col hidden">
                <!-- Dynamic injection target -->
            </div>
        </section>

    </main>

    <!-- Grade Modal -->
    <div id="grade-modal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden flex flex-col text-center p-8 transform transition-all scale-95 opacity-0 duration-300" id="grade-modal-content">
            <h2 class="text-3xl font-bold text-slate-800 mb-2">Case Complete!</h2>
            <div class="text-6xl font-extrabold text-indigo-600 my-6" id="final-score-display">0/6</div>
            <p class="text-lg font-medium text-slate-700 mb-6" id="feedback-comment"></p>
            <button onclick="closeGradeModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-6 rounded-lg transition-colors w-full">Review Case Summary</button>
        </div>
    </div>

    <!-- AI Generator Modal -->
    <div id="ai-modal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col">
            <div class="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                <h3 class="font-bold text-slate-800 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" class="text-indigo-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    Generate AI Case Study
                </h3>
                <button onclick="closeAiModal()" class="text-slate-400 hover:text-slate-600">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="p-5 flex-1 relative">
                <div id="ai-loading" class="hidden absolute inset-0 bg-white/90 z-10 flex flex-col items-center justify-center">
                    <div class="w-8 h-8 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-3"></div>
                    <p class="text-sm font-medium text-indigo-800">Generating NGN Case...</p>
                    <p class="text-xs text-slate-500 mt-1">This may take up to 15 seconds.</p>
                </div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Patient Info / Scenario Prompt</label>
                <textarea id="ai-prompt" rows="4" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none" placeholder="e.g., A 45-year-old male arrives at the ED complaining of a severe headache, photophobia, and a stiff neck."></textarea>
            </div>
            <div class="p-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-3">
                <button onclick="closeAiModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-200 rounded-lg transition-colors">Cancel</button>
                <button onclick="updateLogic()" class="px-4 py-2 text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition-colors shadow-sm">Update Logic</button>
            </div>
        </div>
    </div>

    <!-- JavaScript functionality -->
    <script>
        // Global State Variables
        let totalScore = 0; 
        let currentStepIndex = 0;
        
        // Mock default data for the 6 steps so the app runs out-of-the-box
        const caseSteps = [
            {
                title: "1. Recognize Cues",
                leftData: {
                    notes: `<div class="border-l-4 border-blue-500 pl-4 py-1 mb-4 bg-white">
                                <p class="text-sm text-slate-500 font-semibold mb-1">08:00 - Admission Note</p>
                                <p class="text-slate-700 leading-relaxed text-sm">72-year-old female client admitted to the medical-surgical unit directly from the emergency department with a chief complaint of sudden onset shortness of breath and right-sided chest pain. Client is alert and oriented x4 but appears highly anxious. Lung sounds reveal diminished breath sounds in the right lower lobe.</p>
                            </div>`,
                    vitals: `<div class="bg-slate-50 p-4 rounded text-sm"><p><strong>HR:</strong> 112 bpm</p><p><strong>RR:</strong> 28 breaths/min</p><p><strong>SpO2:</strong> 89% on Room Air</p></div>`,
                    labs: `<div class="bg-slate-50 p-4 rounded text-sm"><p><strong>D-Dimer:</strong> 850 ng/mL (High)</p></div>`
                },
                question: "Which of the following client findings are most concerning and require immediate follow-up? Select all that apply.",
                options: [
                    { val: "A", text: "Heart rate 112 bpm" },
                    { val: "B", text: "SpO2 89% on room air" },
                    { val: "C", text: "Alert and oriented x4" },
                    { val: "D", text: "Sudden onset shortness of breath" }
                ],
                correct: ["A", "B", "D"],
                rationale: "Tachycardia, hypoxia (SpO2 89%), and sudden shortness of breath are the most concerning cues indicating an acute respiratory issue such as a Pulmonary Embolism. Being alert and oriented x4 is a normal finding."
            },
            {
                title: "2. Analyze Cues",
                leftData: {
                    notes: `<div class="border-l-4 border-blue-500 pl-4 py-1 mb-4 bg-white">
                                <p class="text-sm text-slate-500 font-semibold mb-1">08:00 - Admission Note</p>
                                <p class="text-slate-700 leading-relaxed text-sm">72-year-old female client admitted with sudden onset shortness of breath and right-sided chest pain...</p>
                            </div>
                            <div class="border-l-4 border-slate-300 pl-4 py-1 mb-4 bg-white">
                                <p class="text-sm text-slate-500 font-semibold mb-1">08:15 - Update</p>
                                <p class="text-slate-700 leading-relaxed text-sm">Client coughing up small amounts of blood-tinged sputum. Reports pain is 7/10 on inspiration.</p>
                            </div>`,
                    vitals: `<div class="bg-slate-50 p-4 rounded text-sm"><p><strong>HR:</strong> 112 bpm</p><p><strong>RR:</strong> 28 breaths/min</p><p><strong>SpO2:</strong> 89% on Room Air</p></div>`,
                    labs: `<div class="bg-slate-50 p-4 rounded text-sm"><p><strong>D-Dimer:</strong> 850 ng/mL (High)</p></div>`
                },
                question: "Based on the assessment findings, the client is most likely experiencing a/an ________.",
                options: [
                    { val: "A", text: "Myocardial Infarction" },
                    { val: "B", text: "Asthma Exacerbation" },
                    { val: "C", text: "Pulmonary Embolism" },
                    { val: "D", text: "Pneumothorax" }
                ],
                correct: ["C"],
                rationale: "The combination of sudden shortness of breath, pleuritic chest pain, hemoptysis (blood-tinged sputum), tachycardia, and an elevated D-dimer strongly correlates with a Pulmonary Embolism."
            },
            // For brevity in default state, duplicating step 2 data for 3-6 to ensure app functions
            { title: "3. Prioritize Hypotheses", leftData: { notes: "...", vitals: "...", labs: "..." }, question: "What is the priority problem?", options: [{val:"A", text:"Impaired Gas Exchange"}, {val:"B", text:"Acute Pain"}], correct: ["A"], rationale: "Oxygenation is always the priority." },
            { title: "4. Generate Solutions", leftData: { notes: "...", vitals: "...", labs: "..." }, question: "What interventions should be planned?", options: [{val:"A", text:"Administer Oxygen"}, {val:"B", text:"Administer Heparin"}], correct: ["A", "B"], rationale: "Both O2 and anticoagulants are standard treatments." },
            { title: "5. Take Action", leftData: { notes: "...", vitals: "...", labs: "..." }, question: "Which action should the nurse take first?", options: [{val:"A", text:"Apply O2"}, {val:"B", text:"Start IV"}], correct: ["A"], rationale: "Airway/Breathing first." },
            { title: "6. Evaluate Outcomes", leftData: { notes: "...", vitals: "...", labs: "..." }, question: "Which finding indicates improvement?", options: [{val:"A", text:"SpO2 95%"}, {val:"B", text:"HR 110"}], correct: ["A"], rationale: "Improved oxygenation indicates the interventions are working." }
        ];

        // --- UI & TAB NAVIGATION LOGIC ---
        function openTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.add('hidden');
                tab.classList.remove('block');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = 'tab-btn flex-1 py-3 px-4 text-sm font-medium text-slate-500 bg-slate-50 border-b border-slate-200 hover:text-slate-700 hover:bg-slate-100 focus:outline-none transition-colors';
            });

            const activeTab = document.getElementById('tab-' + tabName);
            activeTab.classList.remove('hidden');
            activeTab.classList.add('block');

            const activeBtn = document.getElementById('btn-' + tabName);
            activeBtn.className = 'tab-btn flex-1 py-3 px-4 text-sm font-semibold text-blue-700 bg-white border-b-2 border-blue-600 focus:outline-none transition-colors';
        }

        function buildNav() {
            const navContainer = document.getElementById('step-nav');
            navContainer.innerHTML = '';
            
            caseSteps.forEach((step, index) => {
                const isActive = index === currentStepIndex;
                const isPast = index < currentStepIndex;
                
                let btnClass = `whitespace-nowrap px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2 border `;
                
                if (isActive) {
                    btnClass += `bg-indigo-600 text-white border-indigo-600 shadow-sm`;
                } else if (isPast) {
                    btnClass += `bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700 cursor-pointer`;
                } else {
                    btnClass += `bg-slate-800/50 text-slate-500 border-slate-700/50 cursor-not-allowed`;
                }

                const btn = document.createElement('button');
                btn.className = btnClass;
                btn.innerHTML = `${isPast ? '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-400"><path d="M20 6 9 17l-5-5"/></svg>' : ''} ${step.title}`;
                
                if (isPast || isActive) {
                    btn.onclick = () => loadStep(index);
                }
                
                navContainer.appendChild(btn);
            });
        }

        // --- LOAD STEP LOGIC ---
        function loadStep(index) {
            currentStepIndex = index;
            buildNav();

            const stepData = caseSteps[index];

            // Update Left Panel Data safely
            document.getElementById('tab-notes').innerHTML = stepData.leftData.notes;
            document.getElementById('tab-vitals').innerHTML = stepData.leftData.vitals;
            document.getElementById('tab-labs').innerHTML = stepData.leftData.labs;

            // Generate Checkboxes
            let optionsHtml = '';
            stepData.options.forEach(opt => {
                optionsHtml += `
                    <label class="block relative border-2 border-slate-200 rounded-lg p-4 cursor-pointer hover:bg-slate-50 hover:border-indigo-300 transition-all option-label">
                        <div class="flex items-start gap-3">
                            <input type="checkbox" name="answer" value="${opt.val}" class="w-5 h-5 mt-0.5 text-indigo-600 border-slate-300 focus:ring-indigo-500 rounded">
                            <span class="text-slate-700 leading-snug font-medium">${opt.text}</span>
                        </div>
                    </label>
                `;
            });

            // Generate Question Panel
            const questionHtml = `
                <div class="bg-slate-50 border-b border-slate-200 p-4 shrink-0 flex justify-between items-center">
                    <div class="flex items-center gap-2 text-indigo-600 font-semibold">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                        <span>${stepData.title}</span>
                    </div>
                </div>
                
                <div class="p-6 overflow-y-auto flex-1 flex flex-col">
                    <h2 class="text-lg text-slate-800 font-medium mb-4 leading-relaxed">
                        ${stepData.question}
                    </h2>
                    <span class="text-xs font-bold uppercase tracking-wider text-indigo-500 mb-4 block">Select all that apply</span>
                    
                    <form id="quiz-form" onsubmit="checkAnswer(event)" class="space-y-3 flex-1">
                        ${optionsHtml}
                        
                        <div class="mt-8 pt-4 border-t border-slate-100 flex justify-end gap-3 sticky bottom-0 bg-white pb-2">
                            <button type="submit" id="submit-btn" disabled class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-6 rounded-lg shadow-sm transition-colors focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed">
                                Submit Answer
                            </button>
                            <button type="button" id="next-btn" onclick="nextStep()" class="hidden bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 px-6 rounded-lg shadow-sm transition-colors focus:ring-2 focus:ring-green-500 focus:ring-offset-2 flex items-center gap-2">
                                Next Step
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                            </button>
                        </div>
                    </form>

                    <div id="feedback-area" class="hidden mt-6 rounded-lg p-5 border">
                        <div class="flex items-start gap-3 w-full">
                            <div id="feedback-icon" class="shrink-0 mt-0.5"></div>
                            <div class="flex-1 w-full">
                                <div class="flex justify-between items-center mb-3">
                                    <h3 id="feedback-title" class="font-bold text-lg mb-0"></h3>
                                    <button type="button" id="toggle-rationale-btn" onclick="toggleRationale()" class="text-xs font-semibold bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-md transition-colors shadow-sm flex items-center gap-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                                        Show Rationale
                                    </button>
                                </div>
                                <div id="rationale-container" class="hidden">
                                    <p id="feedback-text" class="text-slate-700 text-sm leading-relaxed mb-4"></p>
                                    <div class="bg-indigo-100/50 border border-indigo-200 rounded p-3 text-xs text-indigo-800 flex gap-2 items-start mt-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="shrink-0 mt-0.5 text-indigo-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.9 1.2 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
                                        <span><strong>Teaching Tip:</strong> Instructors can use this toggle feature as a "Knowledge Check" to query students directly and foster class discussion before revealing the clinical rationale.</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('question-text').innerHTML = questionHtml;
            document.getElementById('question-text').classList.remove('hidden');

            // Attach event listeners to new checkboxes to handle styling and submit button state
            const checkboxes = document.querySelectorAll('input[name="answer"]');
            checkboxes.forEach(input => {
                input.addEventListener('change', function() {
                    const label = this.closest('label');
                    if (this.checked) {
                        label.classList.add('border-indigo-500', 'bg-indigo-50');
                        label.classList.remove('border-slate-200');
                    } else {
                        label.classList.remove('border-indigo-500', 'bg-indigo-50');
                        label.classList.add('border-slate-200');
                    }
                    
                    const anyChecked = document.querySelectorAll('input[name="answer"]:checked').length > 0;
                    document.getElementById('submit-btn').disabled = !anyChecked;
                });
            });
        }

        // --- CHECK ANSWER & FEEDBACK LOGIC ---
        function checkAnswer(event) {
            event.preventDefault();
            
            const selectedElements = document.querySelectorAll('input[name="answer"]:checked');
            const selectedOptions = Array.from(selectedElements).map(el => el.value);
            if (selectedOptions.length === 0) return;

            const currentStepData = caseSteps[currentStepIndex];
            const correctAnswers = Array.isArray(currentStepData.correct) ? currentStepData.correct : [currentStepData.correct];
            
            // Compare arrays exactly
            const selectedSorted = selectedOptions.sort().join(',');
            const correctSorted = correctAnswers.sort().join(',');
            const isCorrect = selectedSorted === correctSorted;

            if (isCorrect) totalScore++;

            // Apply Visual Feedback to Options
            const allInputs = document.querySelectorAll('input[name="answer"]');
            allInputs.forEach(input => {
                const label = input.closest('label');
                const isChecked = input.checked;
                const isCorrectOption = correctAnswers.includes(input.value);

                // Strip standard classes
                label.classList.remove('border-slate-200', 'hover:bg-slate-50', 'hover:border-indigo-300', 'border-indigo-500', 'bg-indigo-50');
                
                if (isChecked && isCorrectOption) {
                    label.classList.add('border-green-500', 'bg-green-50');
                    label.querySelector('span').classList.add('text-green-800');
                } else if (isChecked && !isCorrectOption) {
                    label.classList.add('border-red-500', 'bg-red-50');
                    label.querySelector('span').classList.add('text-red-800');
                } else if (!isChecked && isCorrectOption) {
                    label.classList.add('border-orange-500', 'border-dashed', 'bg-orange-50/50');
                    label.querySelector('span').classList.add('text-orange-800');
                } else {
                    label.classList.add('border-slate-200', 'opacity-50');
                }
                
                input.disabled = true; // Lock input
            });

            // Swap Buttons
            document.getElementById('submit-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.remove('hidden');

            // Show Feedback Box
            const feedbackArea = document.getElementById('feedback-area');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackIcon = document.getElementById('feedback-icon');
            
            feedbackArea.classList.remove('hidden');

            if (isCorrect) {
                feedbackArea.className = 'mt-6 rounded-lg p-5 border border-green-200 bg-green-50 animate-[pulse_0.5s_ease-in-out]';
                feedbackTitle.className = 'font-bold text-lg text-green-800';
                feedbackTitle.innerText = 'Correct!';
                feedbackIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-green-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
            } else {
                feedbackArea.className = 'mt-6 rounded-lg p-5 border border-red-200 bg-red-50';
                feedbackTitle.className = 'font-bold text-lg text-red-800';
                feedbackTitle.innerText = 'Incorrect or Incomplete';
                feedbackIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-red-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;
            }

            document.getElementById('feedback-text').innerHTML = `<strong>Clinical Rationale:</strong> ${currentStepData.rationale}`;
        }

        // --- MODAL & PROGRESSION LOGIC ---
        function toggleRationale() {
            const container = document.getElementById('rationale-container');
            const btn = document.getElementById('toggle-rationale-btn');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg> Hide Rationale`;
                btn.classList.add('bg-indigo-100', 'text-indigo-700');
                btn.classList.remove('bg-slate-200', 'text-slate-700');
            } else {
                container.classList.add('hidden');
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg> Show Rationale`;
                btn.classList.add('bg-slate-200', 'text-slate-700');
                btn.classList.remove('bg-indigo-100', 'text-indigo-700');
            }
        }

        function nextStep() {
            if (currentStepIndex < caseSteps.length - 1) {
                loadStep(currentStepIndex + 1);
            } else {
                showGradeModal();
            }
        }

        function showGradeModal() {
            const modal = document.getElementById('grade-modal');
            const modalContent = document.getElementById('grade-modal-content');
            const scoreDisplay = document.getElementById('final-score-display');
            const feedbackComment = document.getElementById('feedback-comment');
            
            scoreDisplay.innerText = `${totalScore} / ${caseSteps.length}`;
            
            let percentage = (totalScore / caseSteps.length) * 100;
            if (percentage === 100) {
                feedbackComment.innerText = "Excellent Clinical Judgment! You recognized cues and prioritized accurately.";
            } else if (percentage >= 66) {
                feedbackComment.innerText = "Good job! You demonstrated solid clinical reasoning, but be sure to review the missed cues.";
            } else {
                feedbackComment.innerText = "Needs Review. Focus on linking patient cues to the correct hypotheses.";
            }
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeGradeModal() {
            const modal = document.getElementById('grade-modal');
            const modalContent = document.getElementById('grade-modal-content');
            
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        // --- AI GENERATOR LOGIC ---
        const apiKey = ""; // Optional API Key provided by runtime

        function openAiModal() {
            document.getElementById('ai-modal').classList.remove('hidden');
            document.getElementById('ai-modal').classList.add('flex');
        }

        function closeAiModal() {
            document.getElementById('ai-modal').classList.add('hidden');
            document.getElementById('ai-modal').classList.remove('flex');
        }

        async function fetchWithRetry(url, options, maxRetries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return await response.json();
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        }

        async function updateLogic() {
            const promptInput = document.getElementById('ai-prompt').value.trim();
            if (!promptInput) return;

            document.getElementById('ai-loading').classList.remove('hidden');

            const stepSchema = {
                type: "OBJECT",
                properties: {
                    question: { type: "STRING" },
                    options: { type: "ARRAY", items: { type: "STRING" } },
                    correct_answer_indices: { type: "ARRAY", items: { type: "INTEGER" } },
                    nurses_note: { type: "STRING" },
                    rationale: { type: "STRING" }
                },
                required: ["question", "options", "correct_answer_indices", "nurses_note", "rationale"]
            };

            const payload = {
                contents: [{
                    parts: [{ 
                        text: `Create an unfolding clinical case study for the NCLEX NGN based on this patient info: "${promptInput}". 
                        Generate a 6-step unfolding case. Provide the specific question, 4 multiple choice options, the indices of ALL correct answers (0-3), an unfolding nurses' note, and the rationale for each step.` 
                    }]
                }],
                systemInstruction: { parts: [{ text: "You are an expert NCLEX NGN Item Writer." }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            recognize_cues: stepSchema,
                            analyze_cues: stepSchema,
                            prioritize_hypotheses: stepSchema,
                            generate_solutions: stepSchema,
                            take_action: stepSchema,
                            evaluate_outcomes: stepSchema
                        },
                        required: ["recognize_cues", "analyze_cues", "prioritize_hypotheses", "generate_solutions", "take_action", "evaluate_outcomes"]
                    }
                }
            };

            try {
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                const result = await fetchWithRetry(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!jsonText) throw new Error("Invalid API Response");
                
                applyAiDataToCase(JSON.parse(jsonText));
                closeAiModal();

            } catch (error) {
                console.error("AI Error:", error);
            } finally {
                document.getElementById('ai-loading').classList.add('hidden');
            }
        }

        function applyAiDataToCase(aiData) {
            const stepsMap = [
                { key: 'recognize_cues', title: "1. Recognize Cues" },
                { key: 'analyze_cues', title: "2. Analyze Cues" },
                { key: 'prioritize_hypotheses', title: "3. Prioritize Hypotheses" },
                { key: 'generate_solutions', title: "4. Generate Solutions" },
                { key: 'take_action', title: "5. Take Action" },
                { key: 'evaluate_outcomes', title: "6. Evaluate Outcomes" }
            ];

            totalScore = 0;
            caseSteps.length = 0; 
            let cumulativeNotes = "";
            const letters = ["A", "B", "C", "D"];
            
            stepsMap.forEach((stepMeta, index) => {
                const data = aiData[stepMeta.key];
                const timePrefix = `0${8 + index}:00`; 
                
                cumulativeNotes += `
                    <div class="border-l-4 ${index === 0 ? 'border-blue-500' : 'border-slate-300 mt-4'} pl-4 py-1 bg-white">
                        <p class="text-sm text-slate-500 font-semibold mb-1">${timePrefix} - Update</p>
                        <p class="text-slate-700 leading-relaxed text-sm">${data.nurses_note}</p>
                    </div>
                `;

                const formattedOptions = data.options.map((optText, optIdx) => ({
                    val: letters[optIdx] || "X",
                    text: optText
                }));

                const correctLetters = (data.correct_answer_indices || [0]).map(idx => letters[idx] || "A");

                caseSteps.push({
                    title: stepMeta.title,
                    leftData: {
                        notes: cumulativeNotes,
                        vitals: "<div class='text-sm text-slate-500 mt-4 text-center p-4 bg-slate-50 rounded border border-dashed border-slate-300'>Vitals unrecorded for this generated scenario.</div>",
                        labs: "<div class='text-sm text-slate-500 mt-4 text-center p-4 bg-slate-50 rounded border border-dashed border-slate-300'>No recent lab results available.</div>"
                    },
                    question: data.question,
                    options: formattedOptions,
                    correct: correctLetters,
                    rationale: data.rationale
                });
            });
            
            loadStep(0); 
        }

        // Initialize application on load
        window.onload = () => {
            loadStep(0);
        };
    </script>
</body>
